<div class="signUpContainer">
    <h1>Sign Up</h1>
    <form action="">
        <div class="formElement">
            <label for="usernameInput">Username: </label>
            <input type="text" name="usernameInput" id="usernameInput" autocomplete="off" required>
        </div>
        <div class="formElement">
            <label for="emailInput">Email: </label>
            <input type="email" name="emailInput" id="emailInput" autocomplete="off" required>
        </div>
        <div class="formElement">
            <label for="passwordInput">Password: </label>
            <input type="password" name="passwordInput" id="passwordInput" required>
        </div>
        <div class="formElement">
            <label for="confirmPasswordInput">Confirm Password: </label>
            <input type="password" name="confirmPasswordInput" id="confirmPasswordInput" required>
        </div>
        <input type="submit" value="Sign Up">
    </form>
</div>
