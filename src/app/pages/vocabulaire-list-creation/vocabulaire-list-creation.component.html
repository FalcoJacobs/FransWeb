<h5>Als er evenwaardige synoniemen zijn kun je die toevoegen in hetzelfde vakje met een komma als schijding.</h5>
<form>
    <input #listNameInput type="text" placeholder="Naam lijst" class="titleInput" required>
    <input #listDescriptionInput type="text" placeholder="Omschrijving lijst" class="descriptionInput" required>
    <table>
        <thead>
            <tr>
                <th>Woord #</th>
                <th>Nederlands</th>
                <th>Frans</th>
                <th>Voorbeeldzin</th>
            </tr>
        </thead>
        <tbody id="tableContent">
            <tr *ngFor="let row of rows; let i = index">
                <td>{{ i + 1 }}</td>
                <td><input #dutchInput type="text" (keydown.enter)="onEnter($event)" autocomplete="off" autocapitalize="off" autocorrect="off" required #firstInput></td>
                <td><input #frenchInput type="text" (keydown.enter)="onEnter($event)" autocomplete="off" autocapitalize="off" autocorrect="off" required></td>
                <td><input #exampleInput type="text" (keydown.enter)="onEnter($event)" autocomplete="off" autocapitalize="off" autocorrect="off"></td>
            </tr>
        </tbody>
    </table>
    <div class="rowManipulationButtons">
        <button type="button" (click)="addRow()"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M440-280h80v-160h160v-80H520v-160h-80v160H280v80h160v160Zm40 200q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg></button>
        <button type="button" (click)="removeRow()"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M280-440h400v-80H280v80ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg></button>
    </div>
    <button type="button" (click)="makeObject()">Maak aan</button>
</form>
