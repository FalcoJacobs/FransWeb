<header>
  <div class="brand">
    <h1><a href="https://falcojacobs.github.io/FransWeb/">FransWeb</a></h1>
    <select #themeSelect class="theme-select" [value]="currentTheme" (change)="selectTheme(themeSelect.value)">
      <option *ngFor="let t of themes" [value]="t.id">{{ t.label }}</option>
    </select>
  </div>
  <button class="menu-toggle" (click)="isMenuOpen = !isMenuOpen"><svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#e3e3e3"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg></button>
  <nav [class.open]="isMenuOpen">
    <a routerLink="/home" [queryParams]="{ a: 'A' }" routerLinkActive="activeLink" (click)="isMenuOpen = false">Dashboard</a>
    <a routerLink="/home/grammaire" routerLinkActive="activeLink" (click)="isMenuOpen = false">Grammaire</a>
    <a routerLink="/home/vocabulaire" routerLinkActive="activeLink" (click)="isMenuOpen = false">Vocabulaire</a>
    <a routerLink="/home/conjugaison/select" routerLinkActive="activeLink" (click)="isMenuOpen = false">Werkwoorden</a>
    <!-- <a routerLink="/home/classement" [queryParams]="{ selected: 'Vocabulaire' }" routerLinkActive="activeLink" (click)="isMenuOpen = false">Klassement</a> -->
    <a routerLink="/home/profile" routerLinkActive="activeLink" (click)="isMenuOpen = false">Profiel</a>
    <!-- <button (click)="logout()">Logout</button> -->
  </nav>
</header>
